<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLL Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: editor left (Blockly), simulator right (3D view over hub panel). Stacks on narrow screens. */
:root {
  --bg: #F6F7FA;
  --panel: #FFFFFF;
  --line: #DEE3EB;
  --fg: #1E2430;
  --muted: #6B7483;
  --accent: #0A8DFF;
  --run: #2FC25B;
  --stop: #E8232A;
  --hub-yellow: #FFD500;
  --led: #FFD400;
  --radius: 14px;
  --font: "Nunito", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-weight: 600; color: var(--fg); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(10,141,255,.45); outline-offset: 2px; }

/* ---- top bar ---- */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: .01em; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--hub-yellow); color: #1E2430; display: grid; place-items: center; font-weight: 800; }
.project-name { flex: 1 1 160px; min-width: 120px; max-width: 320px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; font-weight: 700; background: var(--bg); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.tb { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.tb:hover { background: var(--bg); }
.tb.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb.primary:hover { filter: brightness(1.05); }
.menu-wrap { position: relative; }
.popover { position: absolute; right: 0; top: calc(100% + 6px); width: min(340px, 90vw); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(30,36,48,.16); padding: 8px; z-index: 50; }
.popover h3 { margin: 4px 8px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.proj { display: flex; align-items: stretch; border-radius: 10px; }
.proj.current { background: #EAF4FF; }
.proj .open { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; padding: 8px 10px; text-align: left; border-radius: 10px; }
.proj .open:hover { background: var(--bg); }
.proj .pn { font-weight: 800; }
.proj .pd { font-size: 11px; color: var(--muted); }
.proj .del { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 10px; border-radius: 10px; }
.proj .del:hover { color: var(--stop); background: #FDECEC; }

/* ---- main layout ---- */
.layout { flex: 1; display: flex; min-height: 0; }
.editor { flex: 1 1 60%; min-width: 0; position: relative; }
#blocklyDiv { position: absolute; inset: 0; }
.editor-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 18px 16px 18px; pointer-events: none; z-index: 5; }
.editor-bar > * { pointer-events: auto; }
.ws-tools { display: flex; gap: 6px; }
.wt { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.95); font-size: 18px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,36,48,.08); }
.wt:hover { background: #fff; border-color: #B9C0CC; }
.run-controls { display: flex; gap: 10px; }
.round { width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(30,36,48,.18); transition: transform .12s ease; }
.round:active { transform: scale(.94); }
.round:disabled { opacity: .45; cursor: default; box-shadow: none; }
.round.run { background: var(--run); }
.round.run span { width: 0; height: 0; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.round.stop { background: #fff; }
.round.stop span { width: 20px; height: 20px; background: #1E2430; border-radius: 3px; }
body.running .round.stop span { background: var(--stop); }

.splitter { flex: 0 0 8px; cursor: col-resize; background: var(--line); position: relative; touch-action: none; user-select: none; }
.splitter::after { content: ""; position: absolute; left: 2px; top: 50%; width: 4px; height: 36px; margin-top: -18px; border-radius: 2px; background: #AEB5C2; }
.splitter:hover, .splitter.active, .splitter:focus-visible { background: #C9D2E0; outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe, body.resizing canvas { pointer-events: none; }
.simpane { flex: 0 0 clamp(320px, 66%, 1500px); min-width: 280px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
.view3d-wrap { position: relative; flex: 1 1 55%; min-height: 220px; }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; touch-action: none; }
.view-tools { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.vt { border: 1px solid rgba(30,36,48,.12); background: rgba(255,255,255,.92); border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px); }
.vt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.view-hint { position: absolute; left: 10px; right: 10px; bottom: 6px; margin: 0; font-size: 11px; color: #4B5563; background: rgba(255,255,255,.75); border-radius: 8px; padding: 4px 8px; pointer-events: none; }

/* ---- hub panel ---- */
#hubPanel { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--bg); overflow: auto; }
.hub { display: flex; gap: 10px; padding: 8px 12px; align-items: stretch; }
.hub-face { flex: 0 0 104px; background: #fff; border: 2px solid #D6DBE4; border-radius: 14px; padding: 6px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: inset 0 0 0 3px var(--hub-yellow); }
.hub-top { display: none; }
.hub-dot { width: 8px; height: 8px; border-radius: 50%; background: #2FC25B; }
.hub-matrix { display: grid; grid-template-columns: repeat(5, 10px); gap: 3px; background: #15171C; padding: 6px; border-radius: 6px; }
.hub-matrix .px { width: 10px; height: 10px; border-radius: 2px; background: #2A2E37; }
.hub-matrix .px.on { background: var(--led); box-shadow: 0 0 4px rgba(255,212,0,.8); }
.hub-buttons { display: flex; gap: 5px; align-items: center; }
.hub-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C9CED8; background: #F1F3F7; font-size: 9px; color: #4B5563; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; padding: 0; }
.hub-btn.down { background: #C9CED8; transform: scale(.94); }
.hub-btn.hub-center { width: 26px; height: 26px; background: #fff; border-color: #B9C0CC; }
.hub-btn.hub-center.lit { box-shadow: 0 0 10px 2px currentColor; }
.hub-readouts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.ro-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.ro.match .v { color: #1B7F3B; }
.ro.match.late .v { color: #B7791F; }
.ro.match.over .v { color: var(--stop); }
.vt.launch { background: var(--run); color: #fff; border-color: var(--run); font-weight: 800; }
.ro { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.ro .k { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ro .v { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; margin-left: auto; }
.ports { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.port { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; font-size: 11px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.port b { font-size: 11px; width: 18px; height: 18px; border-radius: 5px; background: #1E2430; color: #fff; display: grid; place-items: center; flex: none; }
.port .type { color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-size: 8.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.port .v { font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 4px; flex: none; }
.port .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }
.port[data-type="color sensor"] b { background: #3DB7E8; }
.port[data-type="distance"] b { background: #3DB7E8; }
.port[data-type="left wheel"] b, .port[data-type="right wheel"] b { background: #FF4FA8; }

/* ---- toasts / modal ---- */
#toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: none; width: min(520px, calc(100vw - 32px)); }
.toast { background: #1E2430; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.show { opacity: 1; transform: none; }
.toast.warn { background: #B7791F; }
.toast.error { background: var(--stop); }
.spike-modal-back { position: fixed; inset: 0; background: rgba(30,36,48,.45); display: grid; place-items: center; z-index: 200; padding: 16px; }
.spike-modal { background: #fff; border-radius: 16px; padding: 18px; width: min(420px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; }
.spike-modal h3 { margin: 0; }
.spike-modal .msg { margin: 0; font-size: 15px; }
.spike-modal .hint { margin: 0; font-size: 13px; color: var(--muted); }
.spike-modal .in { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; font-weight: 700; }
.spike-modal .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spike-modal label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.spike-modal select { font: inherit; font-weight: 700; color: var(--fg); padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.spike-modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
.spike-modal .btns button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; font-weight: 700; }
.spike-modal .btns .ok { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---- Blockly overrides ---- */
.blocklyToolboxDiv { background: #fff !important; border-right: 1px solid var(--line); padding: 6px 0 !important; }
.blocklyToolboxCategory { margin: 0 !important; }
.blocklyTreeRow { display: flex; flex-direction: column; align-items: center; gap: 4px; height: auto !important; line-height: 1.1 !important; padding: 7px 2px !important; margin: 2px 5px !important; border-radius: 10px; cursor: pointer; border-left: 0 !important; width: 72px; }
.blocklyTreeRow:hover, .blocklyTreeRow.spikeSelected { background: #EEF1F6 !important; }
.blocklyTreeRowContentContainer { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.spikeCatDot { width: 22px; height: 22px; border-radius: 50%; display: block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.blocklyTreeLabel { font: 700 9.5px/1.1 var(--font) !important; text-transform: uppercase; letter-spacing: .03em; color: #5B6472 !important; white-space: normal !important; text-align: center; cursor: pointer; }
.blocklyTreeRow.spikeSelected .blocklyTreeLabel { color: var(--fg) !important; }
.blocklyFlyoutButton { fill: #fff; stroke: var(--line); }
.blocklyFlyoutButton:hover { fill: #EEF1F6; }
.blocklyFlyoutButton .blocklyText { fill: var(--fg); font-weight: 700; }
.blocklyMainBackground { stroke: none; }
.blocklyText { font-family: var(--font) !important; }
.spike-running { filter: drop-shadow(0 0 6px #FFD400) drop-shadow(0 0 2px #FFD400); }
.spike-matrix-editor { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.spike-matrix-editor .grid { display: grid; grid-template-columns: repeat(5, 30px); gap: 4px; }
.spike-matrix-editor .cell { width: 30px; height: 30px; border-radius: 7px; border: 0; background: rgba(0,0,0,.35); padding: 0; }
.spike-matrix-editor .cell.on { background: var(--led); box-shadow: 0 0 6px rgba(255,212,0,.8); }
.spike-matrix-editor .tools { display: flex; gap: 6px; }
.spike-steer-editor { padding: 10px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; user-select: none; }
.spike-steer-editor .dial { touch-action: none; cursor: pointer; }
.spike-steer-editor .bg { fill: rgba(0,0,0,.18); }
.spike-steer-editor .tick { stroke: rgba(255,255,255,.45); stroke-width: 2; stroke-linecap: round; }
.spike-steer-editor .tick.big { stroke: rgba(255,255,255,.8); stroke-width: 3; }
.spike-steer-editor .wedge { fill: rgba(255,255,255,.28); }
.spike-steer-editor .wheel { fill: #fff; }
.spike-steer-editor .wheel-in { fill: rgba(0,0,0,.35); }
.spike-steer-editor .spoke { fill: #fff; }
.spike-steer-editor .hub { fill: #fff; }
.spike-steer-editor .pointer { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
.spike-steer-editor .knob circle { fill: #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.spike-steer-editor .knob .arrow { fill: none; stroke: rgba(0,0,0,.65); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.spike-steer-editor .row { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: space-between; }
.spike-steer-editor .row button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: transparent; color: #fff; font-size: 22px; font-weight: 700; line-height: 1; padding: 0; }
.spike-steer-editor .row button:active { background: rgba(255,255,255,.25); }
.spike-steer-editor .readout { color: #fff; font-weight: 700; font-size: 18px; }
.spike-matrix-editor .tools button { flex: 1; border: 0; border-radius: 8px; padding: 6px 4px; background: rgba(255,255,255,.9); font-size: 12px; font-weight: 700; }

/* ---- narrow screens: sim on top, blocks below ---- */
@media (max-width: 900px) {
  .layout { flex-direction: column-reverse; }
  .simpane { flex: 0 0 46vh; min-width: 0; border-left: 0; border-bottom: 1px solid var(--line); flex-direction: row; }
  .splitter { flex-basis: 10px; cursor: row-resize; }
  .splitter::after { left: 50%; top: 3px; width: 36px; height: 4px; margin: 0 0 0 -18px; }
  body.resizing { cursor: row-resize; }
  .view3d-wrap { flex: 1 1 55%; min-height: 0; }
  #hubPanel { flex: 0 0 min(50%, 330px); border-top: 0; border-left: 1px solid var(--line); }
  .hub { flex-direction: column; padding: 8px; }
  .hub-face { flex: 0 0 auto; }
  .view-hint { display: none; }
  .editor { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: reduce) { .toast, .round { transition: none; } }

/* ---- hub connection / python ---- */
.tb.hub-btn-connect.connected { border-color: var(--run); color: #1B7F3B; background: #EAF9EF; }
.spike-modal.wide { width: min(720px, 100%); }
.spike-modal .code { width: 100%; height: min(60vh, 480px); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; white-space: pre; background: var(--bg); color: var(--fg); }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

/* ---- Make a Block dialog ---- */
.mb-params { display: flex; flex-direction: column; gap: 6px; }
.mb-param { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.mb-param .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; width: 86px; }
.mb-param input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-weight: 700; min-width: 0; }
.mb-param .del { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.mb-add { display: flex; gap: 6px; flex-wrap: wrap; }
.mb-add button { border: 1px dashed #B9C0CC; background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }

/* ---- robot builder ---- */
.builder { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px 12px; overflow: auto; max-height: 55%; }
.builder-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.builder-head h3 { margin: 0; font-size: 15px; flex: 1; }
.builder-presets { display: flex; gap: 6px; }
.builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.builder fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 10px; margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.builder legend { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 4px; }
.builder label { display: grid; grid-template-columns: 1fr 1.2fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.builder select { font: inherit; font-weight: 700; font-size: 12px; color: var(--fg); padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: #fff; min-width: 0; }
.builder .range { display: flex; align-items: center; gap: 6px; }
.builder input[type=range] { flex: 1; min-width: 0; }
.builder output { font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; width: 56px; }
.builder .hint { margin: 2px 0 0; font-size: 12px; color: var(--stop); min-height: 1em; }
body.building #hubPanel { display: none; }


/* ---- score chip + model card (shown when a mission model is clicked) ---- */
.score-chip { margin-left: auto; align-self: center; background: rgba(30,36,48,.85); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.view-tools { right: 10px; }
.model-card { position: absolute; right: 10px; top: 52px; width: min(300px, calc(100% - 20px)); background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(30,36,48,.18); padding: 10px 12px; font-size: 12px; backdrop-filter: blur(6px); }
.model-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.model-card .num { background: #E3000B; color: #fff; border-radius: 6px; padding: 2px 6px; font-weight: 800; font-size: 12px; }
.model-card .title { font-weight: 800; font-size: 14px; flex: 1; }
.model-card .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
.model-card .head { padding-right: 22px; }
.model-card .text { margin: 4px 0 6px; color: #3F4653; }
.model-card .task { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
.model-card .task .pts { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.model-card .task.done { color: #1B7F3B; }
.model-card .task.lost { color: var(--stop); }
.model-card .how { color: var(--muted); }
.model-card .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.model-card .foot .total { font-weight: 800; }
.model-card .result { margin: 8px 0 0; background: #EAF4FF; border-radius: 8px; padding: 6px 8px; }

</style>

<body>
<header class="topbar">
  <div class="brand"><span class="logo">F</span><span>FLL Practice</span></div>
  <input id="projectName" class="project-name" type="text" aria-label="Project name" maxlength="60" spellcheck="false">
  <div class="actions">
    <button type="button" id="btnNew" class="tb">New</button>
    <button type="button" id="btnOpen" class="tb">Open .llsp3</button>
    <button type="button" id="btnSave" class="tb primary">Save .llsp3</button>
    <div class="menu-wrap">
      <button type="button" id="btnProjects" class="tb">My projects</button>
      <div id="projectsPanel" class="popover" hidden></div>
    </div>
    <button type="button" id="btnRobot" class="tb">Robot builder</button>
    <button type="button" id="btnPython" class="tb">Python</button>
    <button type="button" id="btnHub" class="tb hub-btn-connect">Connect hub</button>
    <button type="button" id="btnSendHub" class="tb primary" hidden>Send to hub</button>
    <button type="button" id="btnStopHub" class="tb" hidden>Stop hub</button>
  </div>
</header>
<main class="layout">
  <section class="editor">
    <div id="blocklyDiv"></div>
    <div class="editor-bar">
      <div class="ws-tools">
        <button type="button" id="btnFit" class="wt" title="Fit all blocks">&#8982;</button>
        <button type="button" id="btnZoomOut" class="wt" title="Zoom out">&minus;</button>
        <button type="button" id="btnZoomIn" class="wt" title="Zoom in">+</button>
        <button type="button" id="btnUndo" class="wt" title="Undo">&#8630;</button>
        <button type="button" id="btnRedo" class="wt" title="Redo">&#8631;</button>
      </div>
      <div class="run-controls">
        <button type="button" id="btnStop" class="round stop" aria-label="Stop program"><span></span></button>
        <button type="button" id="btnRun" class="round run" aria-label="Run program"><span></span></button>
      </div>
    </div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-label="Resize simulator panel" aria-orientation="vertical" tabindex="0"></div>
  <aside class="simpane">
    <div class="view3d-wrap">
      <div id="view3d"></div>
      <div class="view-tools">
        <button type="button" id="btnLaunch" class="vt launch" title="Put the robot in the launch area, reset the mission models and run the program with a 2:30 match clock">Launch</button>
        <button type="button" id="btnResetPos" class="vt" title="Put the robot back in the start box">Reset position</button>
        <button type="button" id="btnTurnL" class="vt" title="Turn the robot left 15°">&#8634;</button>
        <button type="button" id="btnTurnR" class="vt" title="Turn the robot right 15°">&#8635;</button>
        <button type="button" id="btnFollow" class="vt" title="Camera follows the robot">Follow</button>
        <button type="button" id="btnCamera" class="vt" title="Reset the camera">Camera</button>
        <span class="score-chip" id="scoreChip" title="Mission points this run">0 pts</span>
      </div>
      <div class="model-card" id="modelCard" hidden></div>
      <p class="view-hint">Drag the robot to move it. Click a mission model to see what it scores. Arrow keys press the hub buttons.</p>
    </div>
    <div id="hubPanel"></div>
    <section id="builder" class="builder" hidden aria-label="Robot builder">
      <div class="builder-head">
        <h3>Robot builder</h3>
        <div class="builder-presets">
          <button type="button" class="tb" data-preset="training-camp">Training Camp preset</button>
          <button type="button" class="tb" data-preset="big-wheels">Big wheels + arm</button>
        </div>
        <button type="button" id="builderDone" class="tb primary">Done</button>
      </div>
      <div class="builder-grid">
        <fieldset><legend>Drive</legend>
          <label>Wheels <select id="bWheel"></select></label>
          <label>Track width <span class="range"><input id="bTrack" type="range" min="8" max="20" step="0.2"><output id="bTrackOut">11.2 cm</output></span></label>
          <label>Hub <select id="bHub"><option value="flat">flat, display up</option><option value="upright">upright, display facing back</option></select></label>
          <label>Left wheel motor <select id="bLeft"></select></label>
          <label>Right wheel motor <select id="bRight"></select></label>
        </fieldset>
        <fieldset><legend>Sensors</legend>
          <label>Color sensor port <select id="bColorPort"></select></label>
          <label>Color sensor mount <select id="bColorMount"></select></label>
          <label>Distance sensor port <select id="bDistPort"></select></label>
          <label>Distance sensor mount <select id="bDistMount"></select></label>
        </fieldset>
        <fieldset><legend>Attachment</legend>
          <label>Module <select id="bModule"></select></label>
          <label>Mount point <select id="bMount"></select></label>
          <label>Motor port <select id="bArmPort"></select></label>
          <p class="hint" id="bIssues"></p>
        </fieldset>
      </div>
    </section>
</main>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileOpen" accept=".llsp3,application/zip" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
